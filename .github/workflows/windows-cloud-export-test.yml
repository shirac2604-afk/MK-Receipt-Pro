name: Windows Cloud Export Test Installer

on:
  workflow_dispatch:
  push:
    branches: ["fix/windows-cloud-report-export"]

permissions:
  contents: read

jobs:
  windows-installer-unsigned-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Select guarded production cloud configuration
        shell: pwsh
        run: |
          Copy-Item apps/desktop/electron/main/SupabaseCloudConfig.production.ts apps/desktop/electron/main/SupabaseCloudConfig.ts -Force
          if (-not (Select-String -Path apps/desktop/electron/main/SupabaseCloudConfig.ts -Pattern 'STUDENT_TEST_MODE=false' -Quiet)) { throw "Production mode is missing" }
          if (-not (Select-String -Path apps/desktop/electron/main/SupabaseCloudConfig.ts -Pattern 'STUDENT_RECEIPTS_ENABLED=false' -Quiet)) { throw "Receipt isolation is missing" }
          if (-not (Select-String -Path apps/desktop/electron/main/SupabaseCloudConfig.ts -Pattern 'REMINDER_AUTO_DISPATCH_ENABLED=false' -Quiet)) { throw "Automatic reminder delivery must remain disabled" }
          if (-not (Select-String -Path apps/desktop/electron/main/SupabaseCloudConfig.ts -Pattern 'noimclnzzuxcszdotmby.supabase.co' -Quiet)) { throw "Production cloud is missing" }
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Cloud export regression tests
        run: npx vitest run tests/cloudReportExport.test.ts
      - name: Google Calendar sync contract
        run: node scripts/verify-google-calendar-sync-v1.mjs
      - name: Manual WhatsApp contract
        run: node scripts/verify-manual-whatsapp-v1.mjs
      - name: Student production safety contract
        run: node scripts/verify-student-production-release.mjs
      - name: Build unsigned Windows test installer
        id: installer
        continue-on-error: true
        run: npm run release:production:win
      - name: Write SHA-256 and unsigned notice
        if: steps.installer.outcome == 'success'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "Maptehot-LaHatzlaha-*-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          "UNSIGNED TEST INSTALLER — for internal testing only. Windows may display a security warning. Do not distribute this installer to customers." | Set-Content -Encoding utf8 release/UNSIGNED-NOTICE.txt
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "SHA256: $hash"
      - name: Upload unsigned test installer
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MK-Receipt-Pro-Windows-Cloud-Export-Test
          path: |
            apps/windows/release/Maptehot-LaHatzlaha-*-Setup.exe
            apps/windows/release/SHA256SUMS.txt
            apps/windows/release/UNSIGNED-NOTICE.txt
          if-no-files-found: error
          retention-days: 14
      - name: Package standalone Windows test folder if installer failed
        if: steps.installer.outcome == 'failure'
        shell: pwsh
        run: |
          npx electron-builder --win --dir --x64 -c.win.signAndEditExecutable=false
          if ($LASTEXITCODE -ne 0) { throw "Standalone Windows packaging failed" }
          Compress-Archive -Path release/win-unpacked/* -DestinationPath release/MK-Receipt-Pro-Windows-Test-Standalone.zip
      - name: Upload standalone Windows test folder
        if: steps.installer.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MK-Receipt-Pro-Windows-Test-Standalone
          path: apps/windows/release/MK-Receipt-Pro-Windows-Test-Standalone.zip
          if-no-files-found: error
          retention-days: 14
