name: Android Production APK

on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - .github/workflows/android-production-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-submit-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.1"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Android production release gates
        run: npm run release:check
      - name: Require Expo build token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Production Android build is blocked until EXPO_TOKEN is configured as a GitHub Actions secret."
            exit 1
          fi
      - name: Initialize the MK Receipt Pro Expo project
        run: npx eas-cli@22.2.0 init --account shirac --non-interactive
      - name: Submit signed Android APK build to Expo
        run: npx eas-cli@22.2.0 build --platform android --profile production-apk --non-interactive --no-wait
