name: Tax Open Isolated Export

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/windows/packages/tax-open/**
      - apps/windows/tests/taxOpenIsolatedExport.test.ts
      - .github/workflows/tax-open-isolated-export.yml

permissions:
  contents: read

jobs:
  isolated-export:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install dependencies without application setup
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Export from synthetic receipt source
        run: npm run test -- tests/taxOpenIsolatedExport.test.ts
