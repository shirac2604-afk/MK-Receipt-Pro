name: Apply Student Navigation Once

on:
  push:
    branches:
      - feature/student-management-v1
    paths:
      - '.github/workflows/apply-student-nav-once.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/student-management-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply targeted renderer patch
        run: node scripts/apply-student-nav-patch.mjs
      - name: Verify patch markers
        run: |
          grep -q 'StudentsContainer' apps/windows/apps/desktop/renderer/src/main.tsx
          grep -q 'LessonsScreen' apps/windows/apps/desktop/renderer/src/main.tsx
          grep -q 'view==="students"' apps/windows/apps/desktop/renderer/src/main.tsx
          grep -q 'view==="lessons"' apps/windows/apps/desktop/renderer/src/main.tsx
      - name: Commit patched renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows/apps/desktop/renderer/src/main.tsx
          git commit -m "feat(students): wire students and lessons into sidebar" || exit 0
          git push origin HEAD:feature/student-management-v1
