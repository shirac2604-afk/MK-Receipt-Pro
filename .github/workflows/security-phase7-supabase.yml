name: Security Phase 7 Supabase

on:
  push:
    branches:
      - security/phase7-tenant-storage-audit
  pull_request:
    branches:
      - main
    paths:
      - supabase/**
      - SECURITY_PHASE7.md
      - scripts/verify-security-phase7.py
      - .github/workflows/security-phase7-supabase.yml

permissions:
  contents: read

jobs:
  tenant-storage-static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Phase 7 static tenant/storage security gate
        run: python3 scripts/verify-security-phase7.py
      - name: SQL files must not contain merge markers
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' supabase SECURITY_PHASE7.md; then
            echo 'Merge markers found'
            exit 1
          fi
      - name: No secrets in Phase 7 files
        run: |
          if grep -R -n -E '(service_role|sk-[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=)' \
            supabase/migrations/20260812110000_security_phase7_storage_key_binding.sql \
            supabase/SECURITY_PHASE7_STAGING_AUDIT.sql \
            SECURITY_PHASE7.md; then
            echo 'Potential secret detected'
            exit 1
          fi
