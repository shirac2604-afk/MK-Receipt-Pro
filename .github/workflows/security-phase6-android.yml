name: Security Phase 6 Android

on:
  push:
    branches:
      - security/phase6-android-boundaries
  pull_request:
    branches:
      - main
    paths:
      - apps/android/**
      - .github/workflows/security-phase6-android.yml

permissions:
  contents: read

jobs:
  android-boundaries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Phase 6 boundary regression gate
        run: npm run verify:android-boundary-hardening
      - name: Existing intrusion hardening
        run: npm run verify:intrusion-hardening
      - name: Existing device management
        run: npm run verify:device-management
      - name: TypeScript
        run: npm run check
