name: Release Phase 9 Artifacts

on:
  push:
    branches:
      - release/phase9-windows-1.1.5-android-1.0.6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Production release checks and NSIS build
        run: npm run release:production:win
      - name: Verify installer and write SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "Maptehot-LaHatzlaha-1.1.5-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows 1.1.5 installer was not produced" }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "SHA256: $hash"
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MK-Receipt-Pro-Windows-1.1.5
          path: |
            apps/windows/release/Maptehot-LaHatzlaha-1.1.5-Setup.exe
            apps/windows/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
