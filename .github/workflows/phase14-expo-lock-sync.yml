name: Phase 14 Expo Lock Sync

on:
  push:
    branches:
      - security/phase14-source-integrity
    paths:
      - .github/workflows/phase14-expo-lock-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-compatible-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - name: Install current dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Align Expo SDK dependencies
        run: npx expo install --fix --npm
      - name: Verify Expo dependency compatibility
        run: npx expo-doctor
      - name: Upload regenerated manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase14-expo-lock-sync
          path: |
            apps/android/package.json
            apps/android/package-lock.json
          if-no-files-found: error
          retention-days: 1
