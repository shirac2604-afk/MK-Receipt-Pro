name: Apply Android Reminder Panel Once
on:
  push:
    branches: [feature/student-management-v1]
    paths: ['.github/workflows/apply-android-reminder-panel-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/student-management-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/apply-android-reminder-panel.mjs
      - run: |
          grep -q 'ReminderSimulationPanel' apps/android/src/screens/StudentHubScreen.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/src/screens/StudentHubScreen.tsx
          git commit -m "feat(android): wire reminder simulation panel"
          git push origin HEAD:feature/student-management-v1
