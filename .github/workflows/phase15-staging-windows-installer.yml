name: Phase 15 Staging Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.1"
      - name: Select Phase 15 Staging cloud configuration
        shell: pwsh
        run: |
          Copy-Item apps/desktop/electron/main/SupabaseCloudConfig.staging.ts apps/desktop/electron/main/SupabaseCloudConfig.ts -Force
          node scripts/verify-staging-release.mjs
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Build internal Staging Windows installer
        run: npm run release:production:win
      - name: Verify installer and write SHA-256
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "Maptehot-LaHatzlaha-*-Setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -eq "Valid") { throw "Staging build must not be presented as a signed production installer" }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          @(
            "PHASE 15 STAGING TEST BUILD — NOT FOR PRODUCTION",
            "This installer is intentionally unsigned and uses the Staging Supabase project.",
            "Install only on a device you control and obtain it only from this GitHub Actions artifact.",
            "SHA-256: $hash"
          ) | Set-Content -Encoding utf8 release/STAGING-BUILD-NOTICE.txt
      - name: Upload Staging installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MK-Receipt-Pro-Phase15-Staging-Windows
          path: |
            apps/windows/release/Maptehot-LaHatzlaha-*-Setup.exe
            apps/windows/release/SHA256SUMS.txt
            apps/windows/release/STAGING-BUILD-NOTICE.txt
          if-no-files-found: error
          retention-days: 7
