name: Apply Student Test Mode Final Once
# retrigger: 2026-08-18
on:
  push:
    branches: [feature/student-management-v1]
    paths: ['.github/workflows/apply-student-test-mode-final-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/student-management-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/apply-student-test-mode-final.mjs
      - run: |
          grep -q 'STUDENT_TEST_MODE' apps/windows/apps/desktop/electron/main/SupabaseCloudService.ts
          grep -q 'לא מופקת קבלה' apps/windows/apps/desktop/renderer/src/students/LessonsScreen.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows/apps/desktop/electron/main/SupabaseCloudService.ts apps/windows/apps/desktop/renderer/src/students
          git commit -m "test(students): finalize isolated staging mode"
          git push origin HEAD:feature/student-management-v1
