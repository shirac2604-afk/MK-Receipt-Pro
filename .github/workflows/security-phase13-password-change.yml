name: Security Phase 13 Password Change

on:
  push:
    branches:
      - main
    paths:
      - apps/android/src/auth/**
      - apps/android/src/context/AuthContext.tsx
      - apps/android/src/screens/MoreScreen.tsx
      - apps/android/src/services/ErrorFormatter.ts
      - apps/android/scripts/verify-password-change.mjs
      - apps/android/package.json
      - apps/windows/apps/desktop/electron/main/SupabaseCloudService.ts
      - apps/windows/apps/desktop/electron/main/passwordPolicy.ts
      - apps/windows/apps/desktop/electron/ipc/databaseHandlers.ts
      - apps/windows/apps/desktop/electron/preload/preload.ts
      - apps/windows/apps/desktop/renderer/src/**
      - apps/windows/packages/database/src/types.ts
      - apps/windows/scripts/verify-password-change.mjs
      - apps/windows/package.json
      - scripts/verify-security-phase13.py
      - .github/workflows/security-phase13-password-change.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/android/src/auth/**
      - apps/android/src/context/AuthContext.tsx
      - apps/android/src/screens/MoreScreen.tsx
      - apps/android/src/services/ErrorFormatter.ts
      - apps/android/scripts/verify-password-change.mjs
      - apps/android/package.json
      - apps/windows/apps/desktop/electron/main/SupabaseCloudService.ts
      - apps/windows/apps/desktop/electron/main/passwordPolicy.ts
      - apps/windows/apps/desktop/electron/ipc/databaseHandlers.ts
      - apps/windows/apps/desktop/electron/preload/preload.ts
      - apps/windows/apps/desktop/renderer/src/**
      - apps/windows/packages/database/src/types.ts
      - apps/windows/scripts/verify-password-change.mjs
      - apps/windows/package.json
      - scripts/verify-security-phase13.py
      - .github/workflows/security-phase13-password-change.yml

permissions:
  contents: read

jobs:
  password-change-static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify Phase 13 controls
        run: python3 scripts/verify-security-phase13.py

  android-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - name: Install Android dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: apps/android
      - name: Type-check Android
        run: npm run check
        working-directory: apps/android

  windows-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - name: Install Windows dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: apps/windows
      - name: Type-check Windows
        run: npm run typecheck
        working-directory: apps/windows
