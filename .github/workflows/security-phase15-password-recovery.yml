name: Security Phase 15 — Password recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'apps/windows/**'
      - 'scripts/verify-security-phase15.py'
      - 'docs/PASSWORD_RECOVERY_STAGING.md'
      - '.github/workflows/security-phase15-password-recovery.yml'
  push:
    branches: [security/phase15-password-recovery]

permissions:
  contents: read

jobs:
  static-security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Phase 15 static security gate
        run: python3 scripts/verify-security-phase15.py

  android-release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run release:check

  windows-type-and-recovery-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:password-recovery
      - run: npm run typecheck
