name: Upgrade Android Expo 57 Once
on:
  push:
    branches: [feature/student-management-v1]
    paths: ['.github/workflows/upgrade-android-expo57-once.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/student-management-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
      - name: Upgrade Expo SDK
        working-directory: apps/android
        env:
          CI: '1'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx expo install expo@^57.0.9 --fix
          npx expo install --fix
      - name: Verify Expo
        working-directory: apps/android
        run: npx expo-doctor
      - name: TypeScript
        working-directory: apps/android
        run: npm run check
      - name: Commit aligned dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/android/package.json
          if [ -f apps/android/package-lock.json ]; then git add -f apps/android/package-lock.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "chore(android): upgrade Expo SDK 57"
          git push origin HEAD:feature/student-management-v1
