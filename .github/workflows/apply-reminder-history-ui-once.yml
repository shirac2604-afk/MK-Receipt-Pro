name: Apply Reminder History UI Once

on:
  push:
    branches:
      - feature/student-management-v1
    paths:
      - '.github/workflows/apply-reminder-history-ui-once.yml'

permissions:
  contents: write

jobs:
  patch-reminder-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/student-management-v1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply targeted reminder history UI patch
        run: node scripts/apply-reminder-history-ui.mjs
      - name: Verify reminder history markers
        run: |
          grep -q 'reminders:list-recent' apps/windows/apps/desktop/electron/preload/preload.ts
          grep -q 'reminders:retry-failed' apps/windows/apps/desktop/electron/preload/preload.ts
          grep -q 'היסטוריית תזכורות' apps/windows/apps/desktop/renderer/src/students/LessonsScreen.tsx
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows/apps/desktop/electron/preload/preload.ts apps/windows/apps/desktop/renderer/src/global.d.ts apps/windows/apps/desktop/renderer/src/students/LessonsScreen.tsx
          git commit -m "feat(students): add reminder history and retry UI" || exit 0
          git push origin HEAD:feature/student-management-v1

